<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Herdr F1</title>
  <!-- Installable app window. Relative paths throughout: the dashboard is served
       from whichever port was free (4158 upward), so an absolute scope would
       break the moment the daemon started on a different one. -->
  <link rel="manifest" href="./manifest.webmanifest" />
  <meta name="theme-color" content="#052B2C" />
  <link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png" />
  <!-- iOS ignores the manifest's icons and takes this one, applying its own
       rounding — so it gets the full-bleed variant, not the inset maskable one. -->
  <link rel="apple-touch-icon" href="./icon-192.png" />
  <!-- iOS Safari predates the manifest's display mode and needs its own opt-in
       for a chrome-less window when launched from the home screen. The standard
       `mobile-web-app-capable` is what other browsers read; the apple-prefixed
       one is kept alongside it because iOS still only honours that spelling. -->
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Herdr F1" />
  <script type="module" crossorigin src="./assets/index-QcDyRNK5.js"></script>
  <link rel="stylesheet" crossorigin href="./assets/index-CpNR6GqH.css">
</head>
<body>
  <div id="app">
    <section id="track-column">
      <header class="chrome">
        <span id="live-pill"><span class="dot"></span><span id="phase-text">RACE LIVE</span></span>
        <span id="lap-text" class="mono">LAP 1 / 58</span>
        <span id="gp-text" class="muted">GRAND PRIX 1</span>
        <span id="race-mode-text" class="mono muted">CLASSIC RACE</span>
        <span id="flag-pill" role="status" hidden>
          <span id="flag-icon" aria-hidden="true"></span>
          <span id="flag-text">YELLOW FLAG</span>
          <span id="flag-count" class="mono"></span>
        </span>
        <label id="circuit-picker" class="push-right">
          <span class="visually-hidden">Circuit</span>
          <select id="circuit-select" aria-label="Circuit"></select>
        </label>
        <span id="connection-text" class="mono"></span>
      </header>
      <div id="track-wrap">
        <canvas id="track" aria-hidden="true"></canvas>
        <div id="overlay" hidden></div>
        <aside id="broadcast-radio" role="status" aria-live="polite" hidden></aside>
      </div>
    </section>
    <section id="standings-column">
      <header class="chrome">
        <span id="standings-title" class="panel-title">CONSTRUCTORS</span>
        <span id="car-count" class="mono muted push-right">—</span>
      </header>
      <div id="standings-scroll">
        <div id="standings" role="list" aria-label="Constructors standings"></div>
        <div id="standings-empty">FORMATION LAP · AWAITING GRID</div>
      </div>
    </section>
    <section id="team-column" hidden>
      <header class="chrome">
        <span class="panel-title">MY TEAM</span>
        <label id="my-team-picker">
          <span class="visually-hidden">Choose my team</span>
          <select id="my-team-select" aria-label="Choose my team"></select>
        </label>
        <span id="my-team-summary" class="mono muted push-right"></span>
      </header>
      <div id="my-team-dashboard">
        <div id="my-team-cars" role="list" aria-label="My team cars"></div>
        <div id="my-team-empty">SELECT YOUR TEAM</div>
      </div>
    </section>
    <section id="radio-column">
      <header class="chrome">
        <button id="radio-toggle" type="button" aria-expanded="true" aria-controls="radio-scroll">
          <span class="panel-title">TEAM RADIO</span>
          <span id="radio-count" class="mono muted"></span>
          <span id="radio-caret" aria-hidden="true"></span>
        </button>
      </header>
      <div id="radio-scroll">
        <div id="radio" role="log" aria-live="polite" aria-label="Team radio"></div>
        <div id="radio-empty">RADIO SILENCE</div>
      </div>
    </section>
  </div>
</body>
</html>
